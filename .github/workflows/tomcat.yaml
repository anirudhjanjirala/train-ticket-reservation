name: Java CI/CD - Build → Sonar → Nexus → Tomcat

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  NEXUS_URL: ${{ secrets.NEXUS_URL }}
  TOMCAT_URL: ${{ secrets.TOMCAT_URL }}

jobs:
  build-analyze-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: ⚙️ Configure Maven settings.xml
        uses: s4u/maven-settings-action@v3.0.0
        with:
          servers: |
            [
              {
                "id": "nexus-releases",
                "username": "${{ secrets.NEXUS_USERNAME }}",
                "password": "${{ secrets.NEXUS_PASSWORD }}"
              },
              {
                "id": "tomcat-server",
                "username": "${{ secrets.TOMCAT_USERNAME }}",
                "password": "${{ secrets.TOMCAT_PASSWORD }}"
              }
            ]

      - name: 🔍 Build and Analyze with SonarQube
        run: |
          mvn -B clean verify sonar:sonar --settings ~/.m2/settings.xml \
            -Dsonar.projectKey=train-ticket-reservation \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: 📦 Deploy Artifact to Nexus
        run: |
          mvn -B deploy --settings ~/.m2/settings.xml \
            -DaltDeploymentRepository=nexus-releases::default::${{ secrets.NEXUS_URL }}/repository/maven-releases/

      - name: 🗂 Check WAR File Size
        run: |
          find target -name "*.war" -exec ls -lh {} +

      - name: 🚀 Deploy WAR to Tomcat
        run: |
          WAR_FILE=$(find target -name "*.war" | head -n 1)
          echo "Deploying $WAR_FILE to Tomcat..."
          curl -v -u "${{ secrets.TOMCAT_USERNAME }}:${{ secrets.TOMCAT_PASSWORD }}" \
               -T "$WAR_FILE" \
               "${{ secrets.TOMCAT_URL }}/deploy?path=/train-ticket-reservation&update=true"
