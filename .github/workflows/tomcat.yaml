name: CI-CD Pipeline (SonarQube + Nexus + Tomcat)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ---------------------
    # 1️⃣ Checkout Source Code
    # ---------------------
    - name: Checkout Code
      uses: actions/checkout@v4

    # ---------------------
    # 2️⃣ Setup Java and Maven
    # ---------------------
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ---------------------
    # 3️⃣ Configure Maven Settings for Nexus
    # ---------------------
    - name: Configure Maven Settings for Nexus
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<EOF
        <settings>
          <servers>
            <server>
              <id>nexus-snapshots</id>
              <username>${{ secrets.NEXUS_USERNAME }}</username>
              <password>${{ secrets.NEXUS_PASSWORD }}</password>
            </server>
          </servers>
          <mirrors>
            <mirror>
              <id>nexus</id>
              <url>${{ secrets.NEXUS_URL }}/repository/maven-public/</url>
              <mirrorOf>*</mirrorOf>
            </mirror>
          </mirrors>
        </settings>
        EOF

    # ---------------------
    # 4️⃣ Run SonarQube Analysis
    # ---------------------
    - name: SonarQube Code Analysis
      env:
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn -B clean verify sonar:sonar \
          -Dsonar.projectKey=TrainBook \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    # ---------------------
    # 5️⃣ Build and Deploy to Nexus
    # ---------------------
    - name: Build and Deploy to Nexus
      env:
        NEXUS_URL: ${{ secrets.NEXUS_URL }}
      run: |
        echo "Building and deploying to Nexus..."
        mvn -B deploy --settings ~/.m2/settings.xml

    # ---------------------
    # 6️⃣ Deploy to Tomcat (only if Nexus deploy succeeds)
    # ---------------------
    - name: Deploy to Apache Tomcat
      if: success()
      env:
        TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
        TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
      run: |
        WAR_FILE=target/TrainBook-1.0.0-SNAPSHOT.war
        echo "Deploying $WAR_FILE to Tomcat..."
        curl -T $WAR_FILE "http://${TOMCAT_USER}:${TOMCAT_PASSWORD}@${TOMCAT_HOST}/manager/text/deploy?path=/TrainBook&update=true"
